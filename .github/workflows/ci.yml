name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Host-only tests
        run: python -m unittest discover -s tests -v
      - name: Build plugin package
        run: python scripts/release.py build --output-dir dist --json
      - name: Verify package and version installation
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem -LiteralPath dist -Filter '*.zip')
          if ($archives.Count -ne 1) { throw 'Expected one release archive' }
          $archive = $archives[0].FullName
          python scripts/release.py verify $archive --checksum "$archive.sha256" --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/release.py install $archive --checksum "$archive.sha256" --install-root build/installed --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: toolkit-package-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error
